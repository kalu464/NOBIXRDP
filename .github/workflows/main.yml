name: PR Tailscale SSH Setup

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  tailscale-ssh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Tailscale + SSH
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          chmod +x scripts/setup_tailscale_ssh.sh
          ./scripts/setup_tailscale_ssh.sh
